<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dice3dview browser smoke</title>
    <link rel="stylesheet" href="../dist/dice3dview.css" />
    <style>
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      const importStarted = performance.now()
      const dice3dview = await import('../dist/dice3dview.es.js')
      const importMs = performance.now() - importStarted
      const { DiceResultViewer, isDisplayCancelledError } = dice3dview

      const createViewer = options => new DiceResultViewer({
        container: '#stage',
        assetPath: '/dist/assets/dice-box/',
        settleTimeout: 2400,
        scale: 3.2,
        ...options
      })

      const assertFaces = (actual, expected) => {
        const faces = actual.dice.map(die => die.value)
        if(JSON.stringify(faces) !== JSON.stringify(expected)) {
          throw new Error(`Face mismatch: ${JSON.stringify(faces)} !== ${JSON.stringify(expected)}`)
        }
      }

      const runDisplay = async ({ enableShadows = false, sides, values, options, resize = false, update }) => {
        const viewer = createViewer({ enableShadows, ...options })
        const originalCanvas = viewer.canvas
        const stage = document.querySelector('#stage')
        const initStarted = performance.now()
        await viewer.init()
        const initMs = performance.now() - initStarted
        if(update) await viewer.updateOptions(update)
        if(resize) {
          stage.style.width = '75%'
          viewer.resize()
        }
        const displayStarted = performance.now()
        const result = await viewer.display({
          id: `d${sides}-${values.length}`,
          dice: values.map((value, index) => ({ id: `die-${index}`, sides, value }))
        })
        const displayMs = performance.now() - displayStarted
        assertFaces(result, values)
        if(!viewer.canvas.isConnected) throw new Error('Viewer canvas was not attached.')
        if(resize && viewer.canvas.width !== Math.round(viewer.canvas.clientWidth * Math.min(2, devicePixelRatio))) {
          throw new Error('Viewer did not resize the backing canvas.')
        }
        let backend = 'main'
        try {
          if(!viewer.canvas.getContext('webgl2') && !viewer.canvas.getContext('webgl')) throw new Error('Missing WebGL context.')
        } catch(error) {
          if(error.name !== 'InvalidStateError') throw error
          backend = 'worker'
        }
        const replacedCanvas = originalCanvas !== viewer.canvas
        viewer.dispose()
        stage.style.width = ''
        if(viewer.canvas.isConnected) throw new Error('dispose() did not remove the canvas.')
        return { initMs, displayMs, backend, replacedCanvas }
      }

      const runTimeline = async () => {
        const progress = []
        const viewer = createViewer({ enableShadows: false, onTimelineProgress: event => progress.push(event) })
        await viewer.init()
        const result = await viewer.displayTimeline({
          id: 'timeline-d6',
          dice: [{ id: 'timeline-die', sides: 6 }],
          events: [{
            sequence: 1,
            type: 'roll',
            subject: 'die',
            dieId: 'timeline-die',
            parentDieId: null,
            rollIndex: 1,
            sourceNodeId: 'browser-smoke',
            value: 6
          }]
        })
        assertFaces(result, [6])
        if(result.eventCount !== 1) throw new Error('Timeline event count mismatch.')
        if(progress.at(-1)?.stage !== 'complete' || !Object.isFrozen(progress.at(-1)?.dice)) {
          throw new Error('Expected a complete, immutable timeline progress snapshot.')
        }
        viewer.dispose()
      }

      // Physical explosion and reroll phases (v3 simulates both).
      const runTimelineEffects = async () => {
        const viewer = createViewer({ enableShadows: false })
        await viewer.init()
        const base = { subject: 'die', rollIndex: 1, sourceNodeId: 'browser-smoke' }
        const result = await viewer.displayTimeline({
          id: 'timeline-effects',
          dice: [{ id: 'root', sides: 6 }, { id: 'child', sides: 6 }, { id: 'other', sides: 20 }],
          events: [
            { ...base, sequence: 1, type: 'roll', dieId: 'root', parentDieId: null, value: 6 },
            { ...base, sequence: 2, type: 'roll', dieId: 'other', parentDieId: null, value: 1 },
            { ...base, sequence: 3, type: 'roll', dieId: 'child', parentDieId: 'root', value: 3 },
            { ...base, sequence: 4, type: 'explode', dieId: 'root', parentDieId: null, childDieId: 'child', value: 3, reason: 'explode' },
            { ...base, sequence: 5, type: 'reroll', dieId: 'other', parentDieId: null, from: 1, to: 14, reason: 'reroll' }
          ]
        })
        assertFaces(result, [6, 3, 14])
        viewer.dispose()
      }

      const runCancellation = async () => {
        const viewer = createViewer({})
        await viewer.init()
        const pending = viewer.display({
          id: 'cancel',
          dice: Array.from({ length: 12 }, (_, index) => ({
            id: `cancel-${index}`,
            sides: 6,
            value: index % 6 + 1
          }))
        })
        setTimeout(() => viewer.clear(), 20)
        try {
          await pending
          throw new Error('Cancelled display unexpectedly resolved.')
        } catch(error) {
          if(!isDisplayCancelledError(error)) throw error
        } finally {
          viewer.dispose()
        }
      }

      const resourceMetrics = () => {
        const resources = performance.getEntriesByType('resource')
        return {
          requests: resources.length,
          transferBytes: resources.reduce((total, entry) => total + entry.transferSize, 0),
          encodedBytes: resources.reduce((total, entry) => total + entry.encodedBodySize, 0),
          decodedBytes: resources.reduce((total, entry) => total + entry.decodedBodySize, 0)
        }
      }

      window.diceSmoke = {
        importMs,
        runDisplay,
        runTimeline,
        runTimelineEffects,
        runCancellation,
        resourceMetrics
      }
    </script>
  </body>
</html>
